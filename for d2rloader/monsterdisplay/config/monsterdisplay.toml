# Monster Display
# Restart the game after changing these options.

[monster-display]

# Read the supplied namespaced HUD from the sibling d2rl-monsterdisplay.mpq folder.
# true: no stock HUD JSON edits in a mod are needed.
# false: use the mod/game HUD (custom HP/resistance/aura widgets are then your responsibility).
use-companion-hud = true

# native: preserve the game's text/controller-icon choice (invalid/missing-value fallback).
# text: element names by default (Fire / localized name); edit Immune* values freely.
# icons: original game immunity shields with a prohibition overlay.
# text uses this plugin's strings.json. Keep Icon* glyph values unchanged
# when using icons: those native result markers select the matching custom sprites.
# To enable icons, change the value below to "icons" and restart the game.
# The sibling d2rl-monsterdisplay.mpq includes all required sprites.
# Custom icons require its HUD widgets; missing widgets fall back to native shields.
# Immunity order follows the first occurrence of each resistance-template element.
# Omitted elements are appended; immunity is never hidden merely by omitting a number.
# The immunity decision, sunder rules, colors and damage calculation are unchanged.
# Invalid values fall back to native. Restart after editing.
immunity-style = "naitve"

# -----------------------------------------------------------------------------
# Display options
# -----------------------------------------------------------------------------
show-monster-hp = true
# LevelLabel in the companion strings.json supplies the prefix for each language.
show-monster-level = true
show-resistances = true

# Appends the aura skill name and its final level to the game's Aura Enchanted
# modifier text. The skill name follows the current game language automatically.
# Examples:
#   Korean : 오라 강화(광신 Lv. 13)
#   English: Aura Enchanted(Fanaticism Lv. 13)
# A Herald with two active auras can show both names and levels, separated by /.
# Set to false to keep the original modifier text unchanged.
show-aura-skill-and-level = true

# -----------------------------------------------------------------------------
# Resistance template
# -----------------------------------------------------------------------------
# Reorder, omit, or repeat placeholders. Literal text is displayed as written.
# Available: {fire} {lightning} {cold} {poison} {magic} {physical}
# {color:ID} changes the color of following literal text such as P:, /, |, or •.
# Resistance values keep the individual colors configured below.
resistance-template = "{fire}{color:0} • {lightning}{color:0} • {cold}{color:0} • {poison}{color:0} • {magic}{color:0} • {physical}"

# Minimum effective resistance shown by Monster Display.
# Keep -100 for normal game behavior. When ResistanceFloor changes [monsters],
# set this to the same minimum_resistance value (for example -1000).
# Values greater than -100 are invalid and fall back to -100.
minimum-displayed-resistance = -100

# Default color for literal text without a preceding {color:ID} directive.
resistance-separator-color = 0

# Individual resistance value colors.
resistance-fire-color = 0x01
resistance-lightning-color = 0x09
resistance-cold-color = 0x03
resistance-poison-color = 0x02
resistance-magic-color = 0x08
resistance-physical-color = 0x04

# D2R inline color IDs (decimal or hexadecimal, valid range 0 through 38).
#  0 White         1 Red           2 BrightGreen   3 Blue
#  4 Gold          5 DarkGray      6 Black         7 PaleGold
#  8 Orange        9 Yellow       10 DarkGreen    11 Purple
# 12 Green        13 LightGray    14 DullGold     15 YellowGreen
# 16 Amber        17 ForestGreen  18 Indigo       19 LimeGreen
# 20 Khaki        21 Silver       22 SoftWhite    23 GrayWhite
# 24 BlueGray     25 Teal         26 Goldenrod    27 Charcoal
# 28 BrightGold   29 Violet       30 Beige        31 Cyan
# 32 Pink         33 Lavender     34 LeafGreen    35 PaleYellow
# 36 SoftRed      37 SkyBlue      38 RedOrange

# -----------------------------------------------------------------------------
# Ready-to-copy resistance template examples
# Remove the leading # from ONE example and replace resistance-template above.
# -----------------------------------------------------------------------------
# Original order, spaces only:
# resistance-template = "{fire} {lightning} {cold} {poison} {magic} {physical}"
# Physical first, slash separators:
# resistance-template = "{physical} / {fire} / {lightning} / {cold} / {poison} / {magic}"
# Physical and magic first, pipe separators:
# resistance-template = "{physical} | {magic} | {fire} | {lightning} | {cold} | {poison}"
# Compact four-element row with white middle dots:
# resistance-template = "{fire}{color:0} • {lightning}{color:0} • {cold}{color:0} • {poison}"
# Gold labels and white slash separators:
# resistance-template = "{color:4}P:{physical}{color:0} / {color:4}F:{fire}{color:0} / {color:4}L:{lightning}{color:0} / {color:4}C:{cold}"
# Element-colored custom labels, including longer words:
# resistance-template = "{color:1}Fire:{fire}{color:0} {color:9}Lightning:{lightning}{color:0} {color:3}Cold:{cold}"
# Separators with different colors: blue dot, red dot, bright-green dot:
# resistance-template = "{fire}{color:3} • {lightning}{color:1} • {cold}{color:2} • {poison}"

# -----------------------------------------------------------------------------
# Optional companion HUD customization
# -----------------------------------------------------------------------------
# The supplied MPQ already contains the required widgets. Editing JSON is optional.
# Automatic level text uses Unique; no LevelValue widget is required.
# Widget names for custom layouts:
#   Name / HPValue                                     = PC top display
#   HPValueScreen / HPValueTarget                       = controller HP display
#   Unique                                             = level and type/properties
#   AuraCompact / AuraNormal                           = aura details
#   ResistanceRowCompact / ResistanceRowNormal / ResistanceRowExpand = resistances
#   Additional / AdditionalExpand                      = immunity display
# Paths inside d2rl-monsterdisplay.mpq:
#   data/global/ui/layouts/monsterdisplay/hudmonsterhealthhd.json
#   data/global/ui/layouts/controller/monsterdisplay/hudmonsterhealthhd.json
#   data/global/ui/layouts/controller/pc/monsterdisplay/hudmonsterhealthhd.json
#   data/global/ui/layouts/controller/console/monsterdisplay/hudmonsterhealthhd.json
#   data/global/ui/layouts/controller/pc/handheld/monsterdisplay/hudmonsterhealthhd.json
# Editable text: Immune* and LevelLabel values for each language.
# Keep Icon* keys and glyph values unchanged.
#   data/local/lng/strings/d2rloader/monsterdisplay/strings.json
